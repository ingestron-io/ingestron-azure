name: Attest runtime distribution

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Azure preview release tag
        required: true
        default: v0.4.1-preview.1

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1e # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Require the approved preview tag
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "v0.4.1-preview.1"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Download distributed preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir runtime
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir runtime
      - name: Verify the immutable Function package
        env:
          AZURE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          test "$(sha256sum runtime/ingestron-jobs-0.1.0-preview.1-cd28333435a4.zip | cut -d' ' -f1)" = "cd28333435a4fa68e528bf49334e3f2499d46ca615b0af395c4b9f6a6d73a340"
          azure_archive="runtime/ingestron-azure-${AZURE_VERSION}.zip"
          azure_sha=$(sha256sum "$azure_archive" | cut -d' ' -f1)
          grep -Fx "$azure_sha  ingestron-azure-${AZURE_VERSION}.zip" runtime/SHA256SUMS
          azure_revision=$(git rev-parse HEAD)
          jq -n \
            --arg sourceRepository "ingestron-io/ingestron-jobs" \
            --arg sourceRevision "9c89a462d345af1941bd37c5ceae3b2af6dc8796" \
            --arg releaseTag "${{ inputs.release_tag }}" \
            --arg worker "ghcr.io/ingestron-io/ingestron-jobs-worker@sha256:896991d8f565c8dda1224361a17e89ad405d0f49dee4e961eaa262e5d4db74e7" \
            --arg azureRevision "$azure_revision" \
            --arg azureSha "$azure_sha" \
            '{contract:"ingestron.runtime-distribution/v1",verification:"digest-matched-release-assets",sourceRepository:$sourceRepository,sourceRevision:$sourceRevision,releaseTag:$releaseTag,azureSource:{repository:"ingestron-io/ingestron-azure",revision:$azureRevision,archiveSha256:$azureSha},workerImage:$worker,license:"LicenseRef-Ingestron-Runtime-Preview-1.0"}' \
            > runtime/distribution-verification.json
      - name: Attest Azure archive distribution verification
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: runtime/ingestron-azure-${{ steps.metadata.outputs.version }}.zip
          predicate-type: https://ingestron.io/attestations/runtime-distribution/v1
          predicate-path: runtime/distribution-verification.json
      - name: Attest Azure archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: runtime/ingestron-azure-${{ steps.metadata.outputs.version }}.zip
          sbom-path: runtime/ingestron-azure-${{ steps.metadata.outputs.version }}.spdx.json
      - name: Attest Function distribution verification
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: runtime/ingestron-jobs-0.1.0-preview.1-cd28333435a4.zip
          predicate-type: https://ingestron.io/attestations/runtime-distribution/v1
          predicate-path: runtime/distribution-verification.json
      - name: Attest Function SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: runtime/ingestron-jobs-0.1.0-preview.1-cd28333435a4.zip
          sbom-path: runtime/ingestron-jobs-0.1.0-preview.1-cd28333435a4.spdx.json
      - name: Upload distribution record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            runtime/distribution-verification.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
