name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1e # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tag and install
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
          pnpm install --frozen-lockfile
      - name: Install pinned Bicep CLI without Azure login
        run: az bicep install --version v0.46.1
      - run: pnpm validate
      - name: Attest Azure archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/ingestron-azure-0.4.0-preview.1.zip
      - name: Attest Azure archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/ingestron-azure-0.4.0-preview.1.zip
          sbom-path: release/ingestron-azure-0.4.0-preview.1.spdx.json
      - name: Create preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/ingestron-azure-0.4.0-preview.1.zip \
            release/ingestron-azure-0.4.0-preview.1.spdx.json \
            release/ingestron-azure-0.4.0-preview.1.provenance.json \
            release/SHA256SUMS \
            RUNTIME-SHA256SUMS \
            LICENSE-RUNTIME-PREVIEW.md \
            --verify-tag \
            --prerelease \
            --title "Ingestron Azure 0.4.0 preview 1" \
            --notes "Unsupported customer-managed Azure technical preview. Source is Apache-2.0; referenced runtime artefacts use the separate Ingestron Runtime Preview Licence. See LICENSING.md, SECURITY.md, and COMPATIBILITY.md before deployment."
