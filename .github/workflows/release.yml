name: Release

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Existing draft release tag containing the immutable runtime files
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1e # v7.0.1
        with:
          ref: ${{ inputs.releaseTag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tag and install
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.releaseTag }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          pnpm install --frozen-lockfile
      - name: Install pinned Bicep CLI without Azure login
        run: az bicep install --version v0.46.1
      - run: pnpm validate
      - name: Download immutable Function distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.releaseTag }}
        run: |
          mkdir runtime
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir runtime \
            --pattern 'ingestron-jobs-0.2.0-preview.1-*'
      - name: Attest Azure archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/ingestron-azure-${{ steps.metadata.outputs.version }}.zip
      - name: Attest Azure archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/ingestron-azure-${{ steps.metadata.outputs.version }}.zip
          sbom-path: release/ingestron-azure-${{ steps.metadata.outputs.version }}.spdx.json
      - name: Complete preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.releaseTag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/ingestron-azure-${{ steps.metadata.outputs.version }}.zip \
            release/ingestron-azure-${{ steps.metadata.outputs.version }}.spdx.json \
            release/ingestron-azure-${{ steps.metadata.outputs.version }}.provenance.json \
            release/SHA256SUMS \
            runtime/* \
            RUNTIME-SHA256SUMS \
            LICENSE-RUNTIME-PREVIEW.md \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease \
            --title "Ingestron Azure ${{ steps.metadata.outputs.version }}" \
            --notes "Unsupported customer-managed Azure technical preview. Source is Apache-2.0; referenced runtime artefacts use the separate Ingestron Runtime Preview Licence. See LICENSING.md, SECURITY.md, and COMPATIBILITY.md before deployment."
